
name: Build Go Application

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Download dependencies
        run: go mod download

      - name: Build ARM64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 1
          CC: aarch64-linux-gnu-gcc
          CGO_CFLAGS: -O2
          CGO_LDFLAGS: -O2
        run: make build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: NetIdActivate_${{ github.sha }}
          path: bin/NetIdActivate_*
          if-no-files-found: error
          retention-days: 1
